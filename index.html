<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AICADBridge Studio</title>
  <meta name="description" content="Doğal dille parametrik CAD modeli üret, doğrula ve CAD programına gönder. Hesapsız yerel mod da var." />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#07090c" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307090c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2300b8d4' stroke-width='2.6'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2300b8d4'/%3E%3C/svg%3E" />
  <script>
    try { var t = localStorage.getItem('aicb-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; } catch (e) {}
  </script>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/geist-sans.woff2" />
  <style>
    @font-face { font-family: "Geist"; src: url(%BASE_URL%fonts/geist-sans.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Geist Mono"; src: url(%BASE_URL%fonts/geist-mono.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
    html{background:#07090c}
    @media (prefers-color-scheme: light){html:not([data-theme=dark]){background:#f5f7fa}}
    html[data-theme=light]{background:#f5f7fa}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
